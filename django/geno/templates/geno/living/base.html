<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestão de arrendamentos{% endblock %} · Alumbris Living</title>
  <style>
    :root { color-scheme: light; font: 16px/1.6 system-ui,sans-serif; color: #172e35; background:#f2f5f3; }
    * { box-sizing:border-box; } body { margin:0; } header { background:#153e42; color:white; padding:1.3rem max(5vw,1rem); }
    header a { color:white; margin-right:1.5rem; } main { max-width:1050px; margin:2rem auto; padding:0 1rem 3rem; }
    h1,h2 { line-height:1.25; } .brand { letter-spacing:.12em; font-size:.8rem; } .card { padding:1.5rem; background:white; border:1px solid #d5dfd9; border-radius:14px; margin:1rem 0; }
    a { color:#176064; } a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid #b97b29; outline-offset:3px; }
    label { display:block; font-weight:600; } input,select { width:100%; padding:.75rem; border:1px solid #738e88; border-radius:6px; font:inherit; background:white; }
    input[type=checkbox] { width:auto; } button,.button { display:inline-block; background:#176064; color:white; border:0; border-radius:6px; padding:.8rem 1.2rem; font:inherit; cursor:pointer; }
    .fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:1rem; }
    .errorlist { color:#a12828; padding-left:1.2rem; } .note { color:#50655e; } dl { display:grid; grid-template-columns:1fr 2fr; gap:.7rem; } dd { margin:0; } dt { font-weight:600; }
  </style>
</head>
<body>
<header><div class="brand">ALUMBRIS LIVING PREMIUM</div><nav aria-label="Navegação principal"><a href="{% url 'geno:living-portfolio' %}">Arrendamentos</a><a href="{% url 'geno:living-new' %}">Novo arrendamento</a><a href="{% url 'geno:resident-portal' %}">Portal do residente</a></nav></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
